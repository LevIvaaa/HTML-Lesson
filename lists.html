<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <!--Пронумерованый список-->
    <ol start="7"> <!--атрибут start ставит с какой цифри будет начинаться список-->
        <li>Купи молоко</li>
        <li>Купи картошку</li>
        <li>Купи машину</li>    
    </ol>

    <ol type="a"> <!--атрибут type позволяет менять отображение цифр-->
        <li>Купи молоко</li>
        <li>Купи картошку</li>
        <li>Купи машину</li>    
    </ol>


    <!--Не пронумерованый список-->
    <ul type="square">
        <li>Купи молоко</li>
        <li>Купи картошку</li>
        <li>Купи машину</li>
    </ul>
</body>
</html>
