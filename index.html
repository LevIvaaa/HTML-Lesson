<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Lev Iva">
    <meta name="keywords" content="test">
    <title>Lesson</title>
</head>
<body>
    <!--Текстовые теги-->
    <!--Заголовки 1-6-->
    <h1>Заголовок <small>1</small></h1>
    <h2>Заголовок <big>2</big></h2>
    <h3>Заголовок 3</h3>
    <h4>Заголовок 4</h4>
    <h5>Заголовок 5</h5>
    <h6>Заголовок 6</h6>

    <!--С нового абзаца-->
    <p>Просто текст</p>
    <p>Просто текст</p>

    <p><b>Просто текст</b></p> <!--жирный текст-->
    <p><strong>Просто текст</strong></p> <!--жирный текст-->
    <p><em>Просто текст</em></p> <!--текст курсивом-->
    <p><i>Просто текст</i></p> <!--текст курсивом-->
    <p><strike>Просто текст</strike></p> <!--текст перечёркнутый-->

    <!--<br> делает меньше отступ чем <p>-->
    H<sup>2</sup>0<br> <!--делает слово или букву выше основного ряда -->

    <!--<hr> делает горизонтальную линию вдоль страницы-->
    H<sub>2</sub>0<hr> <!--делает слово или букву ниже основного ряда -->

    <!--abbr используется для абревиатур-->
    <abbr title="Hyper">HTML</abbr>

    <!--<address> используется для описания адресса-->
    <address>Moscow, Russia</address>
    
    <!--<pre> выводит с сохранением всех отступов и пробелов-->
    <pre>function some() {
        return "Some"
}</pre>

    <!--<code> используется для записания кода-->
        <code>let x = 0</code>
</body>
</html>
