<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <table border="1" width="500px">
        <thead>
            <tr>
                <th>Name</th>
                <th>Surname</th>
            </tr>
        </thead>

        <tbody align="center">
            <tr>
                <td>John1</td>
                <td>Dale</td>
            </tr>
             <tr>
                <td>John2</td>
                <td>Dale</td>
            </tr>
           <tr>
                <td>John3</td>
                <td>Dale</td>
            </tr>
            <tr>
                <td>John4</td>
                <td>Dale</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>Last</td>
                <td>One</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
